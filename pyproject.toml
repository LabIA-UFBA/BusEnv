[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-exploration"
version = "0.1.0"
description = "SUNT - MARL for urban mobility"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Wesley Silva"},
    {name = "Rafael Costa"}
]
license = {text = "MIT"}

# Core dependencies always installed
dependencies = [
    "pyarrow>=12,<14"
]

[project.optional-dependencies]
rllib = [
    "ray[rllib]==2.10.0",
    "ray[tune]",
    "pettingzoo>=1.24.3",
    "supersuit>=3.9.3",
    "torch==2.4.1",
    # match torchvision/torchaudio to torch 2.4.1 for CUDA/ABI compatibility
    "torchvision==0.19.1",
    "torchaudio==2.4.1"
]
data = [
    "pandas>=2.0,<2.1",
    "numpy>=1.24,<2.0"
]
viz = [
    "matplotlib>=3.7",
    "networkx>=3.1"
]
test = [
    "pytest>=7.4"
]

[project.scripts]
graphx = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
